project:
  name: deepguard_resnet34_multitask
  seed: 42
  output_dir: outputs/deepguard_resnet34_multitask

data:
  train_csv: data/manifests/train.csv
  val_csv: data/manifests/val.csv
  test_csv: data/manifests/test.csv
  image_size: 224
  num_workers: 4
  class_names_5cls: [Real, Deepfakes, FaceSwap, Face2Face, NeuralTextures]
  method_names: [Deepfakes, FaceSwap, Face2Face, NeuralTextures]

model:
  type: multitask
  backbone: resnet34
  pretrained: true
  dropout: 0.20
  hidden_dim: 512
  num_methods: 4
  freeze_backbone: false

train:
  epochs: 8
  batch_size: 32
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  amp: true
  grad_clip_norm: 1.0
  log_interval: 20
  selection_metric: composite
  early_stopping_patience: 5

loss:
  lambda_method: 1.50
  method_loss: focal_ce
  focal_gamma: 1.5
  label_smoothing: 0.05
  use_pos_weight: true
  use_method_class_weight: true

inference:
  threshold: 0.50
  max_frames: 32
  frame_stride: 10
