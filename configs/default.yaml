project:
  name: deepguard_resnet34_multitask
  seed: 42
  output_dir: outputs/deepguard_resnet34_multitask

data:
  train_csv: data/manifests/train.csv
  val_csv: data/manifests/val.csv
  test_csv: data/manifests/test.csv
  image_size: 224
  num_workers: 2

model:
  backbone: resnet34
  pretrained: true
  num_methods: 4
  dropout: 0.2

training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  lambda_method: 1.0
  gradient_clip_norm: 1.0
  use_amp: true
  patience: 5

inference:
  threshold: 0.5
  frame_interval: 10

classes:
  real: Real
  methods:
    - Deepfakes
    - FaceSwap
    - Face2Face
    - NeuralTextures
